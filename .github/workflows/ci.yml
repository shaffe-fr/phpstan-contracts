name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: PHP ${{ matrix.php }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, php: "8.3" }
          - { os: ubuntu-24.04, php: "8.4" }
          - { os: ubuntu-24.04, php: "8.5" }
          - { os: windows-latest, php: "8.5" }
          # macos-latest is arm64, so this job installs the darwin-arm64 Z3 build.
          - { os: macos-latest, php: "8.5" }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zip, openssl
          tools: composer:v2
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: Install Z3
        run: php bin/phpstan-contracts-install-z3

      # The installer already runs the binary once; this shows what was installed and that it starts on its own.
      - name: Check the installed Z3
        run: |
          binary="$(php -r 'require "vendor/autoload.php"; echo PhpstanContracts\Solver\Z3Installer::installedBinary();')"
          test -n "$binary"
          ls -l "$(dirname "$binary")"
          test -x "$binary"
          "$binary" --version
          if [ "$RUNNER_OS" = macOS ]; then otool -L "$binary"; fi

      - name: Static analysis of the package and its tests (level 8)
        run: php vendor/bin/phpstan analyse --configuration=phpstan.src.neon --no-progress
      - name: Tests
        env:
          CONTRACTS_REQUIRE_Z3: "1"
        run: composer test
      - name: The examples are proven and refuted as the documentation says
        env:
          CONTRACTS_REQUIRE_Z3: "1"
        run: composer test:examples
