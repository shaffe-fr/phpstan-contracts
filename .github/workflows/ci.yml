name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zip, openssl
          tools: composer:v2
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: Install Z3
        run: php bin/phpstan-contracts-install-z3

      - name: Static analysis of the package and its tests (level 8)
        run: vendor/bin/phpstan analyse --configuration=phpstan.src.neon --no-progress
      - name: Tests
        env:
          CONTRACTS_REQUIRE_Z3: '1'
        run: composer test
      - name: The examples are proven and refuted as the documentation says
        env:
          CONTRACTS_REQUIRE_Z3: '1'
        run: composer test:examples
